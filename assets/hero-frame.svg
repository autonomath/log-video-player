<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic aerial coastal landscape</title>
  <desc id="desc">A stylized cinematic view of mountains, ocean and a glowing sunset.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#457c86"/>
      <stop offset="0.42" stop-color="#80a7a0"/>
      <stop offset="0.69" stop-color="#e0a476"/>
      <stop offset="1" stop-color="#d77c5f"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="74%" cy="28%" r="21%">
      <stop offset="0" stop-color="#fff3c9" stop-opacity="0.96"/>
      <stop offset="0.18" stop-color="#ffc58d" stop-opacity="0.8"/>
      <stop offset="0.62" stop-color="#ed926b" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d77c5f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="farMountain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#365c60"/>
      <stop offset="1" stop-color="#1e3439"/>
    </linearGradient>
    <linearGradient id="nearMountain" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#2c4a49"/>
      <stop offset="0.55" stop-color="#172d2e"/>
      <stop offset="1" stop-color="#0c191b"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0.72">
      <stop offset="0" stop-color="#112f37"/>
      <stop offset="0.48" stop-color="#3a7478"/>
      <stop offset="0.77" stop-color="#a9876e"/>
      <stop offset="1" stop-color="#d59d74"/>
    </linearGradient>
    <linearGradient id="reflection" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd4a3" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#e68763" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.055"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="700" fill="url(#sunGlow)"/>
  <circle cx="1180" cy="265" r="44" fill="#fff0c8" opacity="0.86"/>
  <ellipse cx="1165" cy="288" rx="218" ry="83" fill="#ffb57e" opacity="0.23" filter="url(#soft)"/>

  <path d="M0 488 176 388 306 456 507 308 742 470 904 351 1104 478 1316 356 1600 469 1600 690 0 690Z" fill="url(#farMountain)" opacity="0.72"/>
  <path d="m0 566 258-206 148 178 171-153 181 175 194-121 198 146 154-102 296 173v181H0Z" fill="#244345" opacity="0.74"/>
  <path d="M0 585 204 428l139 158 86-61 152 129L788 511l118 111 199-129 124 109 170-67 201 96v202H0Z" fill="url(#nearMountain)"/>

  <path d="M0 651c195-59 330-72 494-22 189 57 288 129 478 72 210-63 394-71 628-7v306H0Z" fill="url(#water)"/>
  <path d="M1010 647c86-16 175-19 265-6l151 359H967Z" fill="url(#reflection)" opacity="0.54"/>

  <g fill="none" stroke-linecap="round">
    <path d="M86 756c210-32 359-19 529 29" stroke="#9fc1bd" stroke-opacity="0.25" stroke-width="4"/>
    <path d="M624 831c236-52 473-60 818-3" stroke="#efc4a2" stroke-opacity="0.18" stroke-width="5"/>
    <path d="M70 884c297-40 542-21 790 35" stroke="#96c2c1" stroke-opacity="0.13" stroke-width="3"/>
    <path d="M1076 739c107-21 218-18 341 10" stroke="#ffd8ad" stroke-opacity="0.25" stroke-width="4"/>
  </g>

  <path d="M0 847c211-68 402-73 576-19 95 30 160 80 285 97L0 1000Z" fill="#0a181a" opacity="0.84"/>
  <path d="M1600 804c-182-24-297 8-423 72-71 36-147 78-249 96l672 28Z" fill="#172a29" opacity="0.75"/>

  <g fill="#0b1716">
    <path d="m120 823 14-60 13 60Z"/><path d="m146 828 21-86 19 86Z"/><path d="m181 832 16-70 18 70Z"/>
    <path d="m1410 821 20-94 22 94Z"/><path d="m1443 814 15-65 15 65Z"/><path d="m1480 830 23-103 22 103Z"/>
  </g>

  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.65"/>
  <rect width="1600" height="1000" fill="none" stroke="#090b0c" stroke-opacity="0.35" stroke-width="28"/>
</svg>
